<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>AIxPerf - Ver3</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="design-system.css" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: "var(--primary)", hover: "var(--primary-hover)", light: "var(--primary-light)" }
          }
        }
      }
    };
  </script>
  <style type="text/tailwindcss">
    body { font-family: "Inter", sans-serif; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 12px 16px; text-decoration: none; transition: background 0.2s; border-left: 3px solid transparent; font-size: 14px; }
    .nav-item:hover { background: rgba(0, 0, 0, 0.04); }
    .nav-item.active { background: rgba(0, 0, 0, 0.06); border-left-color: var(--primary); font-weight: 600; }
    .nav-item .nav-icon { font-size: 18px; }
    .nav-header-divider { border-bottom: 1px dashed var(--border); }
    .theme-pill.active { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--primary); outline: none; }
  </style>
</head>
<body class="min-h-screen bg-white flex">
  <nav class="w-60 shrink-0 border-r flex flex-col bg-white" style="border-color: var(--border); min-height: 100vh;">
    <div class="h-1 w-full" style="background: #1f2937;"></div>
    <div class="p-4 pb-3 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <img src="https://aixperf-dev.yody.io/assets/logo-tnGAC7nB.svg" alt="AIxPerf Logo" class="w-8 h-8"/>
        <h1 class="text-sm font-bold" style="color: var(--text-main);">AIxPerf</h1>
      </div>
    </div>
    <div class="mx-2 nav-header-divider"></div>
    <div class="flex-1 py-2">
      <a href="#" class="nav-item active" data-panel="hieu-suat-ver3" style="color: var(--text-main);">
        <span class="material-symbols-outlined nav-icon">analytics</span>
        Đánh giá hiệu suất ver3
      </a>
      <a href="#" class="nav-item" data-panel="ypointv2" style="color: var(--text-main);">
        <span class="material-symbols-outlined nav-icon">stars</span>
        YpointV2
      </a>
    </div>
    <div class="p-3 border-t" style="border-color: var(--border);">
      <p class="text-xs font-semibold uppercase tracking-wider mb-2" style="color: var(--text-secondary);">Màu</p>
      <div class="flex flex-wrap gap-2">
        <button type="button" class="theme-pill active rounded-full w-8 h-8 border-2 transition-all hover:scale-110 focus:outline-none focus:ring-2 focus:ring-offset-1" data-theme="gray" title="Mockup xám" style="background: #475569; border-color: #334155;"></button>
        <button type="button" class="theme-pill rounded-full w-8 h-8 border-2 transition-all hover:scale-110 focus:outline-none focus:ring-2 focus:ring-offset-1" data-theme="yody" title="Yody vàng" style="background: #ffc84a; border-color: #e6b43d;"></button>
        <button type="button" class="theme-pill rounded-full w-8 h-8 border-2 transition-all hover:scale-110 focus:outline-none focus:ring-2 focus:ring-offset-1" data-theme="blue" title="Xanh dương" style="background: #2563eb; border-color: #1d4ed8;"></button>
        <button type="button" class="theme-pill rounded-full w-8 h-8 border-2 transition-all hover:scale-110 focus:outline-none focus:ring-2 focus:ring-offset-1" data-theme="emerald" title="Xanh ngọc" style="background: #059669; border-color: #047857;"></button>
      </div>
    </div>
  </nav>

  <div class="flex-1 flex flex-col min-w-0">
    <div id="panel-hieu-suat-ver3" class="panel flex-1 flex flex-col overflow-hidden" style="background:#f8fafc;">
      <div class="flex-1 flex px-6 pb-6 pt-6 min-h-0">
        <iframe
          id="iframe-hieu-suat-ver3"
          src="aixperf-hieu-suat-ver3.html"
          title="Đánh giá hiệu suất Ver3"
          class="w-full h-full"
          style="border: none; background: transparent;"
        ></iframe>
      </div>
    </div>

    <div id="panel-ypointv2" class="panel hidden flex-1 flex flex-col min-h-0 overflow-hidden bg-gray-100">
      <div class="flex-1 flex items-start justify-center overflow-auto py-6 min-h-0">
        <div class="shadow-2xl rounded-[2rem] overflow-hidden border-4 border-gray-800 w-full" style="max-width: 430px;">
          <iframe
            src="ypointv2/ypoint.html"
            title="Y Point - Mobile (V2)"
            class="w-full bg-white"
            style="height: min(884px, 95vh); min-height: 700px; border: none;"
          ></iframe>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var THEME_KEY = "aixperf-theme";
      var currentTheme = "gray";

      function broadcastTheme(theme) {
        var ver3 = document.getElementById("iframe-hieu-suat-ver3");
        if (ver3 && ver3.contentWindow) {
          try { ver3.contentWindow.postMessage({ type: "aixperf-theme", theme: theme }, "*"); } catch (e) {}
        }
      }

      function applyTheme(theme) {
        theme = theme || "gray";
        currentTheme = theme;
        var root = document.documentElement;
        if (theme === "gray") root.removeAttribute("data-theme");
        else root.setAttribute("data-theme", theme);
        try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
        document.querySelectorAll(".theme-pill").forEach(function (btn) {
          btn.classList.toggle("active", btn.getAttribute("data-theme") === theme);
        });
        broadcastTheme(theme);
      }

      window.addEventListener("message", function (e) {
        if (e.data && e.data.type === "aixperf-theme-get") {
          try { e.source.postMessage({ type: "aixperf-theme", theme: currentTheme }, "*"); } catch (err) {}
        }
      });

      document.querySelectorAll(".theme-pill").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var t = this.getAttribute("data-theme");
          if (t) applyTheme(t);
        });
      });

      var saved = null;
      try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
      applyTheme(saved === "yody" || saved === "blue" || saved === "emerald" ? saved : "gray");

      var ver3Frame = document.getElementById("iframe-hieu-suat-ver3");
      if (ver3Frame) {
        ver3Frame.addEventListener("load", function () {
          broadcastTheme(currentTheme);
        });
      }

      document.querySelectorAll(".nav-item").forEach(function (link) {
        link.addEventListener("click", function (e) {
          e.preventDefault();
          var panelId = this.getAttribute("data-panel");
          if (!panelId) return;
          document.querySelectorAll(".nav-item").forEach(function (l) { l.classList.remove("active"); });
          this.classList.add("active");
          document.querySelectorAll(".panel").forEach(function (p) { p.classList.add("hidden"); });
          var panel = document.getElementById("panel-" + panelId);
          if (panel) panel.classList.remove("hidden");
        });
      });
    })();
  </script>
</body>
</html>
