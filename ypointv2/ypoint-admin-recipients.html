<!DOCTYPE html>
<html class="light" lang="vi">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Chọn người nhận - Y Point</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#221f6d",
            "background-light": "#f8fafc",
            "background-dark": "#0f172a"
          },
          fontFamily: { display: ["Inter", "sans-serif"] }
        }
      }
    };
  </script>
  <style type="text/tailwindcss">
    body { font-family: 'Inter', sans-serif; min-height: max(884px, 100dvh); }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .ios-blur { backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
  </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-200 flex flex-col">
  <div class="flex justify-between items-center px-8 py-3 w-full shrink-0">
    <span class="text-sm font-semibold text-slate-900 dark:text-white">13:23</span>
    <div class="flex items-center space-x-1.5 text-slate-900 dark:text-white">
      <span class="material-icons-round text-sm">signal_cellular_alt</span>
      <span class="material-icons-round text-sm">wifi</span>
      <span class="material-icons-round text-sm rotate-90">battery_full</span>
    </div>
  </div>

  <header class="sticky top-0 z-50 bg-background-light/90 dark:bg-background-dark/90 ios-blur">
    <div class="px-4 py-3 flex items-center gap-3 w-full">
      <a class="w-10 h-10 flex-shrink-0 flex items-center justify-center rounded-full bg-white dark:bg-slate-800 shadow-sm border border-slate-100 dark:border-slate-700 active:scale-95 transition-transform"
        href="ypoint-admin.html" aria-label="Quay lại tặng điểm">
        <span class="material-icons-round text-primary dark:text-white">arrow_back</span>
      </a>
      <h1 class="flex-1 min-w-0 text-primary dark:text-white text-xl font-bold truncate">Thêm người nhận</h1>
    </div>
  </header>

  <main class="flex-1 px-4 pt-3 pb-24 space-y-3">
    <div class="relative">
      <span class="material-icons-round pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg">search</span>
      <input id="recipient-search" type="search" autocomplete="off" placeholder="Search tên hoặc mã nhân viên…"
        class="w-full rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-800 text-sm pl-10 pr-3 py-2.5 text-slate-900 dark:text-white placeholder:text-slate-400" />
    </div>

    <section class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-100 dark:border-slate-700 shadow-sm overflow-hidden">
      <div id="recipient-list" class="divide-y divide-slate-100 dark:divide-slate-700 max-h-[min(72vh,620px)] overflow-y-auto hide-scrollbar"></div>
    </section>
  </main>

  <div class="fixed inset-x-0 bottom-0 px-4 pb-5 pt-3 bg-gradient-to-t from-background-light dark:from-background-dark to-transparent">
    <button id="confirm-recipient-btn" type="button"
      class="w-full py-3.5 rounded-2xl text-sm font-bold text-white bg-primary dark:bg-indigo-600 active:scale-[0.98] transition-transform shadow-md shadow-primary/20">
      Xác nhận người nhận
    </button>
  </div>

  <script>
    (function () {
      var RECIPIENT_DATA_STORAGE_KEY = 'ypointAdminRecipientsData';
      var RECIPIENT_PICK_STORAGE_KEY = 'ypointAdminRecipientsPicked';
      var searchEl = document.getElementById('recipient-search');
      var listEl = document.getElementById('recipient-list');
      var confirmBtn = document.getElementById('confirm-recipient-btn');
      var picked = new Set();

      var recipients = [];
      try {
        recipients = JSON.parse(localStorage.getItem(RECIPIENT_DATA_STORAGE_KEY) || '[]');
        if (!Array.isArray(recipients)) recipients = [];
      } catch (e) {
        recipients = [];
      }

      if (!recipients.length) {
        recipients = [
          { id: 'YD09090', name: 'Lê Văn D', dept: 'Kinh doanh Online' },
          { id: 'YD09091', name: 'Nguyễn Thị A', dept: 'Marketing' },
          { id: 'YD09092', name: 'Bùi Minh G', dept: 'Vận hành kho' }
        ];
      }

      try {
        var pickedIds = JSON.parse(localStorage.getItem(RECIPIENT_PICK_STORAGE_KEY) || '[]');
        if (Array.isArray(pickedIds)) {
          pickedIds.forEach(function (id) {
            picked.add(String(id || '').toUpperCase());
          });
        }
      } catch (e) {}

      function initialsOf(name) {
        return (name || '?').split(/\s+/).map(function (p) { return p[0] || ''; }).slice(-2).join('').toUpperCase();
      }

      function renderList() {
        var q = (searchEl.value || '').trim().toLowerCase();
        var rows = recipients.filter(function (r) {
          return !q || r.name.toLowerCase().indexOf(q) !== -1 || r.id.toLowerCase().indexOf(q) !== -1;
        });
        if (!rows.length) {
          listEl.innerHTML = '<div class="px-4 py-6 text-center text-sm text-slate-500 dark:text-slate-400">Không có nhân viên khớp tìm kiếm.</div>';
          return;
        }
        listEl.innerHTML = rows.map(function (r) {
          var checked = picked.has(String(r.id || '').toUpperCase());
          return (
            '<button type="button" class="recipient-row w-full px-4 py-3 flex items-center gap-3 text-left hover:bg-slate-50 dark:hover:bg-slate-700/40" data-id="' + r.id + '">' +
            '<span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-primary/10 text-primary text-[11px] font-extrabold">' + initialsOf(r.name) + '</span>' +
            '<span class="min-w-0 flex-1">' +
            '<span class="block text-sm font-bold text-slate-900 dark:text-white truncate">' + r.name + '</span>' +
            '<span class="block text-[11px] text-slate-400">Mã NV: ' + r.id + '</span>' +
            '<span class="block text-[11px] text-slate-500 dark:text-slate-400">Vị trí: ' + (r.dept || '—') + '</span>' +
            '</span>' +
            '<span class="material-icons-round text-2xl ' + (checked ? 'text-primary' : 'text-slate-300 dark:text-slate-600') + '">' + (checked ? 'check_circle' : 'radio_button_unchecked') + '</span>' +
            '</button>'
          );
        }).join('');
      }

      listEl.addEventListener('click', function (e) {
        var row = e.target.closest && e.target.closest('.recipient-row');
        if (!row) return;
        var id = String(row.getAttribute('data-id') || '').toUpperCase();
        if (!id) return;
        if (picked.has(id)) picked.delete(id); else picked.add(id);
        renderList();
      });

      searchEl.addEventListener('input', renderList);
      confirmBtn.addEventListener('click', function () {
        localStorage.setItem(RECIPIENT_PICK_STORAGE_KEY, JSON.stringify(Array.from(picked)));
        window.location.href = 'ypoint-admin.html';
      });

      renderList();
    })();
  </script>
</body>
</html>
