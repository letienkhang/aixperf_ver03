<!DOCTYPE html>
<html class="light" lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Bảng xếp hạng - Y Point</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#221f6d",
            "background-light": "#f8fafc",
            "background-dark": "#0f172a",
            "accent-orange": "#FFD700",
            "accent-green": "#10b981",
            "accent-blue": "#2563eb",
            "card-light": "#ffffff",
            "card-dark": "#1e293b"
          },
          fontFamily: {
            display: ["Inter", "sans-serif"],
          },
          borderRadius: {
            DEFAULT: "1.25rem",
          },
        },
      },
    };
  </script>
  <style type="text/tailwindcss">
    body { font-family: 'Inter', sans-serif; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .ios-blur { backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
    body { min-height: max(884px, 100dvh); }
    @keyframes crown-glow {
      0%, 100% { transform: translateY(0); filter: drop-shadow(0 0 0 rgba(251,191,36,0)); }
      50% { transform: translateY(-1px); filter: drop-shadow(0 0 8px rgba(251,191,36,0.9)); }
    }
    @keyframes float-soft {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    @keyframes gold-ring-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(251,191,36,0.4); }
      50% { box-shadow: 0 0 18px 4px rgba(251,191,36,0.9); }
    }
    @keyframes premium-float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-6px) scale(1.05); }
    }
    .rank-main-orbit { animation: float-soft 4s ease-in-out infinite; }
    .rank-main-crown { animation: crown-glow 3s ease-in-out infinite; transform-origin: center; }
    .rank-1 { color: #FFD700; }
    .rank-2 { color: #C0C0C0; }
    .rank-3 { color: #CD7F32; }
    .gold-3d { background: linear-gradient(145deg, #FFD700, #B8860B); box-shadow: 0 10px 20px -5px rgba(184, 134, 11, 0.4), inset 0 -4px 0 rgba(0,0,0,0.1); }
    .silver-3d { background: linear-gradient(145deg, #E2E8F0, #94A3B8); box-shadow: 0 4px 10px -2px rgba(148, 163, 184, 0.3), inset 0 -2px 0 rgba(0,0,0,0.05); }
    .bronze-3d { background: linear-gradient(145deg, #FB923C, #C2410C); box-shadow: 0 4px 10px -2px rgba(194, 65, 12, 0.3), inset 0 -2px 0 rgba(0,0,0,0.05); }
    .hero-card { background: radial-gradient(circle at top right, rgba(255, 215, 0, 0.05), transparent), white; }
    .gold-ring { display: inline-flex; padding: 4px; border-radius: 9999px; border: 3px solid #FBBF24; animation: gold-ring-pulse 3s ease-in-out infinite; }
    .top1-achievement-card { background: radial-gradient(circle at 50% 0%, rgba(255, 215, 0, 0.12) 0%, transparent 60%), white; }
    .top2-achievement-card { background: radial-gradient(circle at 50% 0%, rgba(148, 163, 184, 0.18) 0%, transparent 60%), white; }
    .top3-achievement-card { background: radial-gradient(circle at 50% 0%, rgba(248, 153, 112, 0.18) 0%, transparent 60%), white; }
    .top1-divider { height: 1px; background: linear-gradient(90deg, transparent, rgba(226, 232, 240, 0.8), transparent); }
    .top1-gold-circle-frame { padding: 4px; border-radius: 9999px; background: linear-gradient(135deg, #FFD700 0%, #D4AF37 50%, #B8860B 100%); box-shadow: 0 15px 35px -5px rgba(212, 175, 55, 0.4); }
    .top2-silver-circle-frame { padding: 4px; border-radius: 9999px; background: linear-gradient(135deg, #E5E7EB 0%, #9CA3AF 45%, #4B5563 100%); box-shadow: 0 15px 35px -5px rgba(148, 163, 184, 0.4); }
    .top3-bronze-circle-frame { padding: 4px; border-radius: 9999px; background: linear-gradient(135deg, #FDBA74 0%, #FB923C 45%, #C2410C 100%); box-shadow: 0 15px 35px -5px rgba(194, 65, 12, 0.4); }
    .top1-score { color: rgb(250 204 21 / var(--tw-text-opacity, 1)); }
    .premium-float { animation: premium-float 6s ease-in-out infinite; transform-origin: center; }
    .ypoint-score { color: rgb(34 31 109 / var(--tw-text-opacity, 1)); }
  </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-200 flex flex-col">
  <div class="flex justify-between items-center px-8 py-3 w-full shrink-0">
    <span class="text-sm font-semibold text-slate-900 dark:text-white">13:23</span>
    <div class="flex items-center space-x-1.5 text-slate-900 dark:text-white">
      <span class="material-icons-round text-sm">signal_cellular_alt</span>
      <span class="material-icons-round text-sm">wifi</span>
      <span class="material-icons-round text-sm rotate-90">battery_full</span>
    </div>
  </div>
  <header class="sticky top-0 z-50 bg-background-light/90 dark:bg-background-dark/90 ios-blur">
    <div class="px-4 py-3 flex items-center gap-3">
      <a class="w-10 h-10 flex items-center justify-center rounded-full bg-white dark:bg-slate-800 shadow-sm border border-slate-100 dark:border-slate-700 active:scale-95 transition-transform" href="ypoint-shop.html">
        <span class="material-icons-round text-primary dark:text-white">arrow_back</span>
      </a>
      <h1 class="text-primary dark:text-white text-lg font-bold">Bảng xếp hạng</h1>
    </div>
  </header>
  <main class="flex-1 px-4 pt-4 pb-16 space-y-6">
    <div class="flex justify-center gap-6 border-b border-slate-200 dark:border-slate-700">
      <button type="button" data-rank-tab="personal" class="rank-tab pb-2.5 pt-1 text-[11px] font-semibold uppercase tracking-[0.12em] text-slate-400 dark:text-slate-500 border-b-2 border-transparent -mb-px transition-colors">Cá nhân</button>
      <button type="button" data-rank-tab="department" class="rank-tab pb-2.5 pt-1 text-[11px] font-semibold uppercase tracking-[0.12em] text-primary dark:text-white border-b-2 border-amber-400 -mb-px transition-colors">Phòng ban</button>
    </div>
    <div id="ranking-personal" class="ranking-panel hidden space-y-6">
      <section class="rounded-3xl overflow-hidden px-4 pt-5 pb-5">
        <div id="top1-card-personal" class="hero-card dark:bg-slate-800/50 rounded-[2.5rem] p-6 shadow-[0_20px_40px_-15px_rgba(0,0,0,0.08)] relative overflow-hidden cursor-pointer active:scale-[0.99] transition-transform border border-slate-100 dark:border-slate-700">
          <div class="absolute -top-1 right-0 p-4 premium-float">
            <span class="material-symbols-outlined text-yellow-500/20 text-8xl scale-[1.4] rotate-[18deg]">workspace_premium</span>
          </div>
          <div class="relative z-10 flex flex-col items-center text-center">
            <div class="relative mb-6">
              <div class="gold-ring">
                <div class="w-24 h-24 rounded-full bg-white dark:bg-slate-700 shadow-xl flex items-center justify-center overflow-hidden">
                  <span class="material-symbols-outlined text-5xl text-yellow-500 fill-1">person</span>
                </div>
              </div>
              <div class="absolute -bottom-4 left-1/2 -translate-x-1/2 w-11 h-11 gold-3d rounded-full flex items-center justify-center border-4 border-white dark:border-slate-800 text-white font-black text-lg">1</div>
            </div>
            <h2 class="text-[10px] font-extrabold text-yellow-600 uppercase tracking-[0.3em] mb-2">Top cá nhân</h2>
            <h3 class="text-xl font-extrabold text-slate-900 dark:text-white mb-1">Nguyễn Văn An</h3>
            <div class="flex items-center gap-2">
              <span class="text-2xl font-black text-primary">2,890</span>
              <span class="text-xs font-bold text-slate-400 uppercase tracking-tighter">pts</span>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4 mt-8 pt-6">
            <div class="flex items-center gap-3">
              <div class="relative">
                <div class="w-12 h-12 rounded-xl bg-slate-50 dark:bg-slate-700 flex items-center justify-center">
                  <span class="material-symbols-outlined text-2xl text-slate-400">person</span>
                </div>
                <div class="absolute -top-2 -right-2 w-5 h-5 silver-3d rounded-full flex items-center justify-center border-2 border-white dark:border-slate-800 text-white font-bold text-[10px]">2</div>
              </div>
              <div>
                <p class="text-[10px] font-bold text-slate-500 dark:text-slate-400 truncate max-w-[100px]">Trần Thị Bình</p>
                <p class="text-sm font-black text-slate-800 dark:text-slate-100">2,450 pts</p>
              </div>
            </div>
            <div class="flex items-center gap-3">
              <div class="relative">
                <div class="w-12 h-12 rounded-xl bg-slate-50 dark:bg-slate-700 flex items-center justify-center">
                  <span class="material-symbols-outlined text-2xl text-slate-400">person</span>
                </div>
                <div class="absolute -top-2 -right-2 w-5 h-5 bronze-3d rounded-full flex items-center justify-center border-2 border-white dark:border-slate-800 text-white font-bold text-[10px]">3</div>
              </div>
              <div>
                <p class="text-[10px] font-bold text-slate-500 dark:text-slate-400 truncate max-w-[100px]">Lê Văn Cường</p>
                <p class="text-sm font-black text-slate-800 dark:text-slate-100">2,100 pts</p>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
    <div id="ranking-department" class="ranking-panel space-y-6">
      <section class="rounded-3xl overflow-hidden px-4 pt-5 pb-5">
        <div id="top1-card" class="hero-card rounded-[2.5rem] p-6 shadow-[0_20px_40px_-15px_rgba(0,0,0,0.08)] relative overflow-hidden cursor-pointer active:scale-[0.99] transition-transform">
          <div class="absolute -top-1 right-0 p-4 premium-float">
            <span class="material-symbols-outlined text-yellow-500/20 text-8xl scale-[1.4] rotate-[18deg]">workspace_premium</span>
          </div>
          <div id="top1-trigger" class="relative z-10 flex flex-col items-center text-center">
            <div class="relative mb-6">
              <div class="gold-ring">
                <div class="w-24 h-24 rounded-full bg-white shadow-xl flex items-center justify-center overflow-hidden">
                  <span class="material-symbols-outlined text-5xl text-yellow-500 fill-1">rocket_launch</span>
                </div>
              </div>
              <div class="absolute -bottom-4 left-1/2 -translate-x-1/2 w-11 h-11 gold-3d rounded-full flex items-center justify-center border-4 border-white text-white font-black text-lg">1</div>
            </div>
            <h2 class="text-[10px] font-extrabold text-yellow-600 uppercase tracking-[0.3em] mb-2">Top Công ty</h2>
            <h3 class="text-xl font-extrabold text-slate-900 dark:text-white mb-1">Nhân sự hạnh phúc</h3>
            <div class="flex items-center gap-2">
              <span class="text-2xl font-black text-primary">2,890</span>
              <span class="text-xs font-bold text-slate-400 uppercase tracking-tighter">pts</span>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>
  <script>
    (function () {
      var rankTabs = document.querySelectorAll('.rank-tab[data-rank-tab]');
      var rankPanels = document.querySelectorAll('.ranking-panel');
      rankTabs.forEach(function (tab) {
        tab.addEventListener('click', function () {
          var value = tab.getAttribute('data-rank-tab');
          rankTabs.forEach(function (t) {
            var isActive = t.getAttribute('data-rank-tab') === value;
            t.classList.toggle('text-primary', isActive);
            t.classList.toggle('dark:text-white', isActive);
            t.classList.toggle('border-amber-400', isActive);
            t.classList.toggle('text-slate-400', !isActive);
            t.classList.toggle('dark:text-slate-500', !isActive);
            t.classList.toggle('border-transparent', !isActive);
          });
          rankPanels.forEach(function (panel) {
            var id = panel.id;
            var show = (id === 'ranking-personal' && value === 'personal') || (id === 'ranking-department' && value === 'department');
            panel.classList.toggle('hidden', !show);
          });
        });
      });
    })();
  </script>
</body>
</html>
